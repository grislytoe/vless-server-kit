{% extends 'base.html' %}{% block content %}<section class="login"><h1>Сменить пароль</h1>
{% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">
<label>Текущий пароль<input type="password" name="current_password" autocomplete="current-password" maxlength="256" required></label>
<label>Новый пароль<input type="password" name="new_password" autocomplete="new-password" minlength="16" maxlength="256" required></label>
<label>Повтор нового пароля<input type="password" name="confirmation" autocomplete="new-password" minlength="16" maxlength="256" required></label>
<p class="muted small">16–256 символов. После смены потребуется войти заново на всех устройствах.</p><button>Сохранить пароль</button></form>
<p><a class="button secondary" href="{{ url_for('index') }}">Назад в панель</a></p></section>{% endblock %}
